<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111214">
<title>amAr</title>
<link rel="preload" href="lib/greatvibes.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* la letra de la pantalla de inicio: Great Vibes (SIL OFL 1.1), recortada al latin con acentos, 35 KB */
  @font-face{font-family:'Caligrafia';src:url('lib/greatvibes.woff2') format('woff2');font-display:block}
  :root{--fondo:#111214;--caja:#1a1c20;--borde:#2a2d33;--tinta:#f3f4f6;--gris:#9aa0a9;--acento:#f05a5a;--verde:#5fd38d}
  html,body{margin:0;height:100%;background:var(--fondo);color:var(--tinta);font:16px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
  #video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#000}
  /* !important: el modulo three.js del motor de 8th Wall escribe como estilo el tamaño en pixeles de dispositivo
     (1080x2040 en vez de 393x742): el lienzo desborda la pantalla y se ve solo una esquina, como con zoom */
  #lienzo{position:fixed;inset:0;width:100% !important;height:100% !important;display:block;touch-action:none}
  #inicio{position:fixed;inset:0;z-index:4;overflow:auto;background:var(--fondo);display:grid;grid-template-rows:auto 1fr auto;min-height:100%}
  #portada{aspect-ratio:4/3;max-height:46vh;background:#0b0c0e center/cover no-repeat;display:grid;place-items:center;color:var(--gris);font-size:13px;letter-spacing:4px}
  #cuerpo{padding:22px 22px 10px}
  #marca{font-size:11px;letter-spacing:6px;color:var(--acento);font-weight:700;margin-bottom:10px}
  h1{margin:0 0 8px;font-size:24px;font-weight:700;line-height:1.2;letter-spacing:-.2px}
  #leyenda{font-size:17px;color:var(--tinta);opacity:.9;margin-bottom:10px}
  #ayuda{margin:0;color:var(--gris);font-size:14px}
  #botones{padding:10px 22px calc(22px + env(safe-area-inset-bottom));display:grid;gap:10px}
  button,a.boton{background:var(--caja);color:var(--tinta);border:1px solid var(--borde);border-radius:14px;padding:16px 16px;font:600 15px -apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;min-height:56px;text-align:left;text-decoration:none;display:block}
  button small{display:block;color:var(--gris);font-weight:400;font-size:13px;margin-top:3px}
  button.principal{background:var(--acento);border-color:var(--acento);color:#fff}
  button.principal small{color:rgba(255,255,255,.8)}
  button.chica{padding:10px 14px;min-height:46px;font-size:13px;text-align:center;border-radius:12px}
  button.peligro{color:var(--acento)}
  button:disabled{opacity:.4}
  @keyframes girar{to{transform:rotate(360deg)}}
  .girando{width:16px;height:16px;border:2px solid var(--borde);border-top-color:var(--acento);border-radius:50%;animation:girar .8s linear infinite;display:inline-block;flex:none}
  #arranque{display:none;align-items:center;gap:12px;color:var(--gris);font-size:14px;min-height:56px}
  #botones.auto>button{display:none}
  #botones.auto #arranque{display:flex}
  #bSinCamara{display:none;text-align:center;font-size:13px;min-height:46px;padding:10px 14px;border-radius:12px;color:var(--gris)}
  #botones.auto #bSinCamara{display:block}
  #inicio.tocar{cursor:pointer}
  #inicio.tocar .girando{display:none}
  #hud{position:fixed;inset:0;z-index:3;display:none;pointer-events:none}
  #hud>*{pointer-events:auto}
  /* en camara no hay texto: una cruz para salir (y, en las escenas, un boton para reubicar), nada mas */
  .cruz{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;width:42px;height:42px;min-height:0;padding:0;border-radius:50%;background:rgba(17,18,20,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;z-index:6;opacity:.92;transition:opacity .2s}
  .cruz:active{opacity:1;background:rgba(17,18,20,.7)}
  .cruz svg{width:18px;height:18px;stroke:#fff;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
  #bReubicar{right:66px}
  #estado{position:fixed;left:14px;top:calc(18px + env(safe-area-inset-top));right:70px;display:none;padding:10px 14px;background:rgba(17,18,20,.55);font-size:14px;border-radius:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);width:max-content;max-width:calc(100% - 100px)}
  #estado.ok{color:var(--verde)} #estado.mal{color:var(--acento)}
  #pie{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));display:grid}
  #bLlamado{text-align:center;background:var(--acento);border-color:var(--acento);color:#fff;font-weight:700;letter-spacing:.5px}
  /* ANTES DE LA CAMARA (Niko, 15/10): solo la frase, en caligrafia, gris claro sobre oscuro con una luz suave al
     centro. Mientras baja, la misma letra y una linea finita de progreso; cuando esta lista, "Tocá para empezar"
     respira. Nada mas: ni marca, ni botones, ni instrucciones */
  #inicio.silencio{grid-template-rows:1fr;background:radial-gradient(90% 60% at 50% 48%,#1e1f22 0%,#141517 55%,#0c0c0e 100%)}
  #inicio.silencio #portada,#inicio.silencio #cuerpo,#inicio.silencio #capacidades,#inicio.silencio #bSinCamara{display:none}
  #inicio.silencio #botones{align-content:center;justify-items:center;padding-left:18px;padding-right:18px}
  #inicio.silencio #arranque{font:400 clamp(34px,9.5vw,60px)/1.25 'Caligrafia',cursive;color:#a6a6a8;letter-spacing:0;text-transform:none;justify-content:center;text-align:center;text-shadow:0 0 22px rgba(166,166,168,.10);animation:respira 3.2s ease-in-out infinite}
  #inicio.silencio .girando{display:none}
  #inicio.tocar #arranque{color:#c4c4c6;font-size:clamp(42px,12vw,74px);text-shadow:0 0 28px rgba(196,196,198,.16);animation:respira 2.6s ease-in-out infinite, aparece .9s ease-out}
  @keyframes respira{0%,100%{opacity:.62}50%{opacity:1}}
  @keyframes aparece{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  #inicio.silencio~#pieMarca{display:none}
  #carga{display:none;width:min(56vw,260px);margin:10px auto 0}
  #carga .barra{height:1px;background:rgba(166,166,168,.16);overflow:hidden}
  #carga .barra i{display:block;height:100%;width:0;background:rgba(196,196,198,.75);transition:width .2s}
  #carga small{display:block;text-align:center;color:rgba(166,166,168,.42);font-size:10px;margin-top:10px;letter-spacing:2px}
  #inicio.silencio.tarda #bSinCamara{display:block}
  #inicio.fallo #arranque{font:400 15px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-transform:none;letter-spacing:0;color:var(--tinta);max-width:min(80vw,380px);text-align:center;justify-content:center;text-shadow:none;animation:none}
  #inicio.fallo .girando{display:none}
  #inicio.fallo #bReintentar,#inicio.fallo #bSinCamara{display:block}
  #bReintentar{display:none;text-align:center;background:var(--acento);border-color:var(--acento);color:#fff;font-weight:700;letter-spacing:.5px;min-height:50px;width:min(80vw,380px);margin:14px auto 0}
  body.camara #pieMarca,body.camara #tecnico{display:none}
  /* en camara no hay textos ni botones: solo la cruz (y en las escenas, reubicar). El llamado va en el menu, al salir */
  body.camara #pie{display:none}
  body.camara.debug #tecnico{display:block}
  #cargando{position:fixed;left:0;right:0;bottom:0;height:4px;background:#2a2d33;z-index:5;display:none}
  #cargando i{display:block;height:100%;width:0;background:var(--acento);transition:width .2s}
  #ver{position:fixed;inset:0;z-index:2;overflow:auto;display:none;padding:14px 14px 120px;background:var(--fondo)}
  #ver .obra{margin:0 auto 26px;max-width:520px}
  #ver .marco{position:relative;width:100%;border-radius:12px;overflow:hidden;background:#000}
  #ver .marco img,#ver .marco video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #ver .titulo{font-weight:700;margin:12px 2px 4px}
  #ver .descripcion{color:var(--gris);font-size:14px;margin:0 2px}
  #ver .llamado{display:inline-block;margin-top:10px;color:var(--acento);font-weight:600;text-decoration:none}
  #pieMarca{position:fixed;right:14px;bottom:calc(8px + env(safe-area-inset-bottom));font-size:10px;letter-spacing:4px;color:#555a63;z-index:2;pointer-events:none}
  #tecnico{position:fixed;left:14px;bottom:calc(8px + env(safe-area-inset-bottom));font-size:9px;color:#555a63;z-index:2;pointer-events:none;letter-spacing:.5px}
</style>
</head>
<body>
<video id="video" autoplay muted playsinline></video>
<canvas id="lienzo"></canvas>
<div id="ver"></div>
<div id="cargando"><i></i></div>

<div id="inicio" class="silencio">
  <div id="portada"></div>
  <div id="cuerpo">
    <div id="marca">amAr</div>
    <h1 id="titulo">...</h1>
    <div id="leyenda"></div>
    <p id="ayuda"></p>
  </div>
  <div id="botones" class="auto">
    <div id="arranque"><span class="girando"></span><span id="arranqueTexto">cargando</span></div>
    <div id="carga"><div class="barra"><i></i></div><small id="cargaTexto"></small></div>
    <button id="bAR" class="principal" style="display:none">APUNTAR CON LA CÁMARA<small></small></button>
    <button id="bVentana" style="display:none">VER CON LA CÁMARA<small>girá el teléfono para mirarlo; no sigue tus pasos</small></button>
    <button id="b3D">VER SIN CÁMARA<small></small></button>
    <a id="menuLlamado" class="boton chica" style="display:none" target="_blank" rel="noopener"></a>
    <button id="bReintentar" onclick="location.reload()">VOLVER A INTENTAR</button>
    <button id="bSinCamara">ver sin cámara</button>
    <p id="capacidades" style="margin:4px 2px 0;font-size:12px;color:#555a63"></p>
  </div>
</div>

<div id="hud">
  <div id="estado"></div>
  <button id="bSalir" class="cruz" aria-label="salir"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button id="bReubicar" class="cruz" aria-label="reubicar" style="display:none"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
  <div id="pie">
    <a id="bLlamado" class="boton chica" style="display:none" target="_blank" rel="noopener"></a>
  </div>
</div>
<div id="pieMarca">amAr</div>
<div id="tecnico"></div>

<script>
  // El descargador de la pieza: baja cada archivo contando los bytes (para la barra de progreso) y, si se le
  // pide, lo guarda como blob (videos, modelos). Los scripts del motor se bajan solo para dejarlos en la cache
  // del navegador: despues el motor los pide por su cuenta y ya estan. En un telefono, el motor (1 MB + 5,5 MB)
  // empieza a bajar ya mismo, en paralelo con todo lo demas.
  (function () {
    const D = window.amarDescargas = { recibido: {}, total: {}, listo: {}, blobs: {}, promesas: {}, error: {} };
    D.bajar = function (ruta, conBlob) {
      if (D.promesas[ruta]) return D.promesas[ruta];
      D.recibido[ruta] = 0;
      D.promesas[ruta] = fetch(ruta).then(async (r) => {
        if (!r.ok) throw new Error(r.status + ' ' + ruta);
        const largo = +r.headers.get('content-length') || 0;
        if (largo && !r.headers.get('content-encoding')) D.total[ruta] = largo;
        const partes = [], lector = r.body.getReader();
        for (;;) { const { done, value } = await lector.read(); if (done) break; D.recibido[ruta] += value.byteLength; if (conBlob) partes.push(value); }
        D.listo[ruta] = true;
        if (conBlob) { D.blobs[ruta] = URL.createObjectURL(new Blob(partes, { type: r.headers.get('content-type') || '' })); return D.blobs[ruta]; }
        return null;
      }).catch((e) => { D.error[ruta] = e; D.listo[ruta] = true; return null; });
      return D.promesas[ruta];
    };
  })();
  for (const href of ['escena.js', 'modos/ventana.js']) { const l = document.createElement('link'); l.rel = 'modulepreload'; l.href = href; document.head.appendChild(l); }
</script>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js" } }
</script>
<script type="module" src="./amar.js"></script>
</body>
</html>
